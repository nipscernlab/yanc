name: CI

# Builds all three compilers (cmmcomp, asmcomp, appcomp) plus comp2gtkw
# on every push and pull request to catch breakages before they reach a
# release tag. Mirrors the relevant parts of release.yml but skips the
# packaging / release-creation steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64 + bison + flex)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            bison
            flex

      - name: Build cmmcomp
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd CMMComp/Sources
          bison -y -d CMMComp.y
          flex CMMComp.l
          gcc -O2 -Wall -Werror -o cmmcomp.exe \
              ast.c data_assign.c data_declar.c data_use.c itr.c diretivas.c \
              funcoes.c labels.c lex.yy.c oper.c saltos.c stdlib.c t2t.c \
              variaveis.c array_index.c global.c macros.c messages.c args.c \
              y.tab.c
          test -x cmmcomp.exe
          rm -f lex.yy.c y.tab.c y.tab.h

      - name: Build appcomp
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd APPComp/Sources
          flex -o app.c app.l
          gcc -O2 -Wall -Werror -o appcomp.exe \
              app.c eval.c variaveis.c messages.c args.c
          test -x appcomp.exe
          rm -f app.c

      - name: Build asmcomp
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ASMComp/Sources
          flex -o ASMComp.c ASMComp.l
          gcc -O2 -Wall -Werror -o asmcomp.exe \
              ASMComp.c eval.c labels.c opcodes.c variaveis.c t2t.c \
              hdl.c simulacao.c array.c messages.c args.c
          test -x asmcomp.exe
          rm -f ASMComp.c

      - name: Build comp2gtkw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd Scripts
          gcc -O2 -Wall -Werror -o comp2gtkw.exe comp2gtkw.c
          test -x comp2gtkw.exe

      - name: Smoke test full pipeline on all examples
        shell: msys2 {0}
        # For every .cmm in CMMComp/Tests/, copy the processor directory to a
        # writable scratch area (so generated files do not dirty the
        # checkout) and run the full toolchain end-to-end:
        #
        #   cmmcomp  : <file.cmm> -> Software/<prname>.asm
        #   appcomp  : Software/<prname>.asm -> tmp/app_log.txt
        #   asmcomp  : Software/<prname>.asm -> Hardware/<prname>.v
        #                                     + Hardware/<prname>_data.mif
        #                                     + Hardware/<prname>_inst.mif
        #
        # Same named-option shapes as go_proc.bat. The Hardware/ subdir is
        # created up front because asmcomp does not mkdir it itself. Any
        # non-zero exit or missing/empty expected artifact fails the job.
        run: |
          set -uo pipefail

          ROOT="$(pwd)"
          CMMCOMP="$ROOT/CMMComp/Sources/cmmcomp.exe"
          APPCOMP="$ROOT/APPComp/Sources/appcomp.exe"
          ASMCOMP="$ROOT/ASMComp/Sources/asmcomp.exe"
          MAC_DIR="$ROOT/CMMComp/Macros"
          HDL_DIR="$ROOT/HDL"
          SCRATCH="$ROOT/.smoke"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"

          fail=0
          while IFS= read -r cmm; do
            proc_dir_rel="$(dirname "$(dirname "$cmm")")"  # strip /Software/file.cmm
            prname="$(basename "$proc_dir_rel")"
            filename="$(basename "$cmm")"

            work_proc="$SCRATCH/proc/$prname"
            tmp_dir="$SCRATCH/tmp/$prname"
            mkdir -p "$tmp_dir" "$(dirname "$work_proc")"
            cp -r "$proc_dir_rel" "$work_proc"
            mkdir -p "$work_proc/Hardware" "$work_proc/Simulation"

            asm_file="$work_proc/Software/$prname.asm"

            echo "=== smoke: $filename ==="

            if ! "$CMMCOMP" -en -i "$filename" -n "$prname" -p "$work_proc" -m "$MAC_DIR" -t "$tmp_dir"; then
              echo "FAIL: cmmcomp exited non-zero for $prname"; fail=1; continue
            fi
            [ -s "$asm_file" ] || { echo "FAIL: $asm_file missing/empty"; fail=1; continue; }

            if ! "$APPCOMP" -en -i "$asm_file" -t "$tmp_dir"; then
              echo "FAIL: appcomp exited non-zero for $prname"; fail=1; continue
            fi
            [ -s "$tmp_dir/app_log.txt" ] || { echo "FAIL: app_log.txt missing/empty"; fail=1; continue; }

            if ! "$ASMCOMP" -en -i "$asm_file" -p "$work_proc" -d "$HDL_DIR" -m "$MAC_DIR" -t "$tmp_dir" -f 100 -c 1000; then
              echo "FAIL: asmcomp exited non-zero for $prname"; fail=1; continue
            fi
            for art in "$prname.v" "${prname}_data.mif" "${prname}_inst.mif"; do
              [ -s "$work_proc/Hardware/$art" ] || { echo "FAIL: Hardware/$art missing/empty"; fail=1; }
            done
          done < <(find CMMComp/Tests -name '*.cmm' | sort)

          rm -rf "$SCRATCH"
          exit "$fail"
