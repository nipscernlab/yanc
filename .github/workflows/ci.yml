name: CI

# Builds the six tools (yanc, cmmcomp, cppcomp, asmcomp, comp2gtkw, gen_gtkw)
# on every push and pull request to catch breakages before they reach a
# release tag. Mirrors the relevant parts of release.yml but skips the
# packaging / release-creation steps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 (ucrt64 + make + bison + flex)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            bison
            flex

      - name: Build binaries (make, -Werror)
        shell: msys2 {0}
        # Build all six binaries through the top-level Makefile (single source
        # of truth). $(OS)=Windows_NT here, so the Makefile emits .exe into bin/.
        # -Werror gates new warnings (CI only; user/release builds stay lenient).
        run: |
          set -euo pipefail
          make CFLAGS="-O2 -Wall -Werror"
          ls -l bin

      - name: Smoke test full pipeline on all examples
        shell: msys2 {0}
        # For every test Compilers/CMMComp/Tests/<p>/<p>.cmm, copy the test to a
        # writable scratch area (so generated files do not dirty the
        # checkout) and run the full toolchain end-to-end into the test's
        # output folder <p>/:
        #
        #   cmmcomp  : <p>.cmm -> <p>/<p>.asm (+ the tables)
        #   asmcomp  : <p>/<p>.asm -> <p>/app_log.txt (first pass), <p>/<p>.v
        #              + <p>_data.mif + <p>_inst.mif
        #
        # Any non-zero exit or missing/empty expected artifact fails the job.
        run: |
          set -uo pipefail

          ROOT="$(pwd)"
          CMMCOMP="$ROOT/bin/cmmcomp.exe"
          ASMCOMP="$ROOT/bin/asmcomp.exe"
          SCRATCH="$ROOT/.smoke"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"

          fail=0
          while IFS= read -r cmm; do
            proc_dir_rel="$(dirname "$cmm")"
            prname="$(basename "$proc_dir_rel")"
            filename="$(basename "$cmm")"

            work_proc="$SCRATCH/proc/$prname"   # the test: the .cmm and its own files
            out="$work_proc/$prname"            # its output folder
            mkdir -p "$(dirname "$work_proc")"
            cp -r "$proc_dir_rel" "$work_proc"

            asm_file="$out/$prname.asm"

            echo "=== smoke: $filename ==="

            if ! "$CMMCOMP" -o "$out" "$work_proc/$filename"; then
              echo "FAIL: cmmcomp exited non-zero for $prname"; fail=1; continue
            fi
            [ -s "$asm_file" ] || { echo "FAIL: $asm_file missing/empty"; fail=1; continue; }

            if ! "$ASMCOMP" -f 100 -c 1000 "$asm_file"; then
              echo "FAIL: asmcomp exited non-zero for $prname"; fail=1; continue
            fi
            for art in "$prname.v" "${prname}_data.mif" "${prname}_inst.mif"; do
              [ -s "$out/$art" ] || { echo "FAIL: $art missing/empty"; fail=1; }
            done
          done < <(for d in Compilers/CMMComp/Tests/*/; do d="${d%/}"; f="$d/$(basename "$d").cmm"; [ -f "$f" ] && echo "$f"; done | sort)

          rm -rf "$SCRATCH"
          exit "$fail"

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain + Icarus
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make bison flex iverilog

      - name: Build binaries (make, -Werror)
        # Same shared Makefile as Windows, gated with -Werror (CI only).
        run: make CFLAGS="-O2 -Wall -Werror"

      - name: Smoke test full pipeline on all examples
        # Same end-to-end check as the Windows job, against the Linux binaries
        # in bin/ (no .exe). Any non-zero exit or missing artifact fails.
        run: |
          set -uo pipefail

          ROOT="$(pwd)"
          CMMCOMP="$ROOT/bin/cmmcomp"
          ASMCOMP="$ROOT/bin/asmcomp"
          SCRATCH="$ROOT/.smoke"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"

          fail=0
          while IFS= read -r cmm; do
            proc_dir_rel="$(dirname "$cmm")"
            prname="$(basename "$proc_dir_rel")"
            filename="$(basename "$cmm")"

            work_proc="$SCRATCH/proc/$prname"   # the test: the .cmm and its own files
            out="$work_proc/$prname"            # its output folder
            mkdir -p "$(dirname "$work_proc")"
            cp -r "$proc_dir_rel" "$work_proc"

            asm_file="$out/$prname.asm"

            echo "=== smoke: $filename ==="

            if ! "$CMMCOMP" -o "$out" "$work_proc/$filename"; then
              echo "FAIL: cmmcomp exited non-zero for $prname"; fail=1; continue
            fi
            [ -s "$asm_file" ] || { echo "FAIL: $asm_file missing/empty"; fail=1; continue; }

            if ! "$ASMCOMP" -f 100 -c 1000 "$asm_file"; then
              echo "FAIL: asmcomp exited non-zero for $prname"; fail=1; continue
            fi
            for art in "$prname.v" "${prname}_data.mif" "${prname}_inst.mif"; do
              [ -s "$out/$art" ] || { echo "FAIL: $art missing/empty"; fail=1; }
            done
          done < <(for d in Compilers/CMMComp/Tests/*/; do d="${d%/}"; f="$d/$(basename "$d").cmm"; [ -f "$f" ] && echo "$f"; done | sort)

          rm -rf "$SCRATCH"
          exit "$fail"

      - name: README Quick start, as written
        # Every sh block after a <!-- quickstart-sh --> marker in README.md,
        # in order, run on the release layout (make stage) and on the
        # package's example, so the documented commands cannot drift from
        # what the tools do. The README's own SAPHO line points at a
        # placeholder and gtkwave needs a screen: both are left out here.
        # Then the result is checked: 55, and a waveform view.
        run: |
          set -euo pipefail
          make stage STAGE="$RUNNER_TEMP/yanc"
          awk '/<!-- quickstart-sh/{f=1;next} f&&/^```sh/{p=1;next} p&&/^```/{p=0;f=0;next} p' README.md \
            | grep -v -e '^export SAPHO=' -e '^gtkwave ' > "$RUNNER_TEMP/quickstart.sh"
          test -s "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
          "$RUNNER_TEMP/yanc/install.sh"
          export PATH="$HOME/.local/bin:$PATH"
          export SAPHO="$RUNNER_TEMP/yanc/SAPHO"
          mkdir -p "$RUNNER_TEMP/qs" && cd "$RUNNER_TEMP/qs"
          cp "$RUNNER_TEMP/yanc/example/my_program.cpp" .
          bash -e "$RUNNER_TEMP/quickstart.sh"
          test "$(tr -d '\r' < my_program/output_0.txt)" = 55
          test -s my_program/my_program_tb.gtkw

  # What a Windows user does with a release, as README.md and docs/ say it:
  # MSYS2's UCRT64 with its newest packages (update: true, so a package that
  # MSYS2 drops or breaks shows here first), the package's install.sh, the
  # README Quick start, and the manual's Verilator command.
  windows-user:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 UCRT64, the packages the manual lists
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            bison
            flex
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-iverilog
            mingw-w64-ucrt-x86_64-verilator
            mingw-w64-ucrt-x86_64-lz4

      - name: Stage the release package and run its install.sh
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make stage STAGE="$(cygpath -u "$RUNNER_TEMP")/yanc"
          cd "$(cygpath -u "$RUNNER_TEMP")/yanc"
          ./install.sh < /dev/null
          cat /etc/profile.d/yanc.sh

      - name: README Quick start, in a new UCRT64 terminal
        shell: msys2 {0}
        # A new step is a new login shell: yanc comes from /etc/profile.d.
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          command -v yanc
          awk '/<!-- quickstart-sh/{f=1;next} f&&/^```sh/{p=1;next} p&&/^```/{p=0;f=0;next} p' README.md \
            | grep -v -e '^export SAPHO=' -e '^gtkwave ' > "$T/quickstart.sh"
          export SAPHO="$T/yanc/SAPHO"
          mkdir -p "$T/qs" && cd "$T/qs"
          cp "$T/yanc/example/my_program.cpp" .
          bash -e "$T/quickstart.sh"
          test "$(tr -d '\r' < my_program/output_0.txt)" = 55
          test -s my_program/my_program_tb.gtkw

      - name: The manual's Verilator command
        shell: msys2 {0}
        # docs/simulation.md, with the -CFLAGS it says MSYS2's gcc 16 needs.
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          export SAPHO="$T/yanc/SAPHO"
          mkdir -p "$T/vl" && cd "$T/vl"
          cp "$T/yanc/example/my_program.cpp" .
          yanc my_program.cpp
          cd my_program
          verilator --binary --timing --trace +define+YANC_TRACE --timescale 1ns/1ps \
                    -CFLAGS -D_GLIBCXX_ASSERTIONS \
                    --top-module my_program_tb -Wno-lint -Wno-MULTIDRIVEN -Wno-BLKANDNBLK \
                    -Wno-COMBDLY -Wno-STMTDLY -Wno-INFINITELOOP -Wno-UNOPTFLAT --Mdir vl \
                    -y "$SAPHO" my_program_tb.v my_program.v
          ./vl/Vmy_program_tb
          test "$(tr -d '\r' < output_0.txt)" = 55

  # The manual (docs/): built on every push the way the release publishes it.
  # -W makes every Sphinx warning an error (a broken link, a page outside the
  # table of contents), so the manual cannot fall behind unnoticed.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the manual
        run: |
          python -m pip install -r docs/requirements.txt
          python -m sphinx -W --keep-going -b html docs docs/_build/html
