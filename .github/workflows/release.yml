name: Release YANC binaries

# Builds the YANC compilers (cmmcomp, asmcomp, appcomp, comp2gtkw) on a
# Windows runner with MSYS2 + MinGW-w64, packages everything as a zip,
# and publishes it as a release asset.
#
# Usage:
#   - Pushing a v* tag (e.g. git tag v1 && git push origin v1) runs the
#     workflow automatically, creates a "YANC v1" release, and attaches
#     yanc-bin-v1.zip to it.
#   - workflow_dispatch runs without creating a release; the zip is
#     uploaded as an artifact for inspection.
#
# Aurora consumes the asset via components/Scripts/download-yanc.js,
# which pins the expected tag (update it there when a new tag goes up).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw64 + bison + flex)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            bison
            flex
            zip

      - name: Build binaries
        shell: msys2 {0}
        # Each compiler follows the same pattern as build.bat: run
        # bison/flex when applicable, gcc on the sources, then move the
        # .exe into out/bin. -O2 yields slightly leaner binaries than the
        # default.
        run: |
          set -euo pipefail
          mkdir -p out/bin

          # cmmcomp
          pushd CMMComp/Sources
          bison -y -d CMMComp.y
          flex CMMComp.l
          gcc -O2 -o cmmcomp.exe \
              ast.c emit.c data_assign.c data_declar.c data_use.c itr.c diretivas.c \
              funcoes.c labels.c lex.yy.c oper.c saltos.c stdlib.c t2t.c \
              variaveis.c array_index.c global.c macros.c messages.c args.c \
              y.tab.c
          mv cmmcomp.exe ../../out/bin/
          rm -f lex.yy.c y.tab.c y.tab.h
          popd

          # appcomp
          pushd APP/Sources
          flex -o app.c app.l
          gcc -O2 -o appcomp.exe \
              app.c eval.c variaveis.c messages.c args.c
          mv appcomp.exe ../../out/bin/
          rm -f app.c
          popd

          # asmcomp
          pushd ASM/Sources
          flex -o ASMComp.c ASMComp.l
          gcc -O2 -o asmcomp.exe \
              ASMComp.c eval.c labels.c opcodes.c variaveis.c t2t.c \
              hdl.c simulacao.c array.c messages.c args.c
          mv asmcomp.exe ../../out/bin/
          rm -f ASMComp.c
          popd

          # comp2gtkw
          pushd Scripts
          gcc -O2 -o comp2gtkw.exe comp2gtkw.c
          mv comp2gtkw.exe ../out/bin/
          popd

          ls -l out/bin

      - name: Stage HDL + Macros
        shell: msys2 {0}
        # Also bundle the SAPHO libraries (HDL/ — Verilog modules for
        # processor/core/ula/etc — and Macros/ — float LUTs and helpers)
        # alongside the binaries. Aurora downloads the zip and extracts
        # it into components/, so bin/, HDL/ and Macros/ land in
        # components/{bin,HDL,Macros}/ without any extra code on the
        # Aurora side.
        #
        # Scripts/ is left out because Aurora's components/Scripts/
        # contains its own build files (copy-components.js,
        # download-toolchain.js, download-yanc.js, etc.) mixed in with
        # the SAPHO scripts. Overwriting wholesale would break the build.
        run: |
          set -euo pipefail
          cp -r HDL out/HDL
          cp -r Macros out/Macros
          ls -l out

      - name: Determine artifact name
        id: artifact
        shell: bash
        # On a tag push, GITHUB_REF_NAME is the tag (e.g. v1). On
        # workflow_dispatch it is the branch (e.g. main); we use the
        # label 'manual' in that case to make clear it is not an
        # official release.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=yanc-bin-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual" >> "$GITHUB_OUTPUT"
            echo "name=yanc-bin-manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd out
          # Zip bin/, HDL/ and Macros/ — extracting into components/
          # produces components/{bin,HDL,Macros}/, which is exactly the
          # layout Aurora expects.
          zip -r "../${{ steps.artifact.outputs.name }}.zip" bin HDL Macros
          ls -la "../${{ steps.artifact.outputs.name }}.zip"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}.zip
          retention-days: 14

      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'YANC ${{ github.ref_name }}'
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.name }}.zip
